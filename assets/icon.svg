<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#ff9a2e"/>
      <stop offset="0.55" stop-color="#f6821f"/>
      <stop offset="1" stop-color="#d95a06"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#7a3200" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- 圆角底板 -->
  <g filter="url(#shadow)">
    <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg)"/>
    <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#glow)"/>
  </g>

  <!-- 闪电 -->
  <path d="M296 64 L160 296 H250 L222 384 L352 168 H262 Z"
        fill="#ffffff" stroke="#ffffff" stroke-width="12" stroke-linejoin="round"/>

  <!-- 底部额度条：已用 72% -->
  <g>
    <rect x="136" y="416" width="240" height="32" rx="16" fill="#ffffff" fill-opacity="0.26"/>
    <rect x="136" y="416" width="173" height="32" rx="16" fill="#ffffff"/>
  </g>
</svg>
